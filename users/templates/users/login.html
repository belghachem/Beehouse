{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Bee House</title>
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Epilogue:wght@400;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Favicon -->
    <link rel="icon" type="image/x-icon" href="{% static 'Images/BEEBLACK.png' %}" />
    
    <!-- Stylesheets -->
    <link rel="stylesheet" href="{% static 'CSS/bee-house-shared.css' %}">
    <link rel="stylesheet" href="{% static 'CSS/login.css' %}">
    <link rel="stylesheet" href="{% static 'CSS/mobile.css' %}">
</head>
<body>
    <!-- Header -->
    <header class="header">
        <nav class="nav-bar" role="navigation">    
            <div class="logo">
                <a href="{% url 'home:home_page' %}" aria-label="Bee House Home">
                    <img class="beelogo" src="{% static 'Images/BEEBLACK.png' %}" alt="Bee House Logo">
                </a>
            </div>
            
            <div class="nav-right">
                <!-- Hamburger Menu -->
                <div class="hamburger-menu">
                    <button class="hamburger-btn" aria-label="Menu" id="menuToggle">
                        <span class="hamburger-line"></span>
                        <span class="hamburger-line"></span>
                        <span class="hamburger-line"></span>
                    </button>
                    <div class="dropdown-menu" id="dropdownMenu">
                        <a href="{% url 'home:home_page' %}" class="dropdown-item">Home</a>
                        <a href="{% url 'products:product_page' %}" class="dropdown-item">Products</a>
                        <a href="{% url 'contactus:contact' %}" class="dropdown-item">Contact Us</a>
                    </div>
                </div>
                
                <!-- Profile Icons -->
                <div class="profile">
                    <div class="cart-icon-container">
                        <a href="{% url 'cart:view_cart' %}" aria-label="Shopping Cart">
                            <img src="{% static 'Images/cart-icon.png' %}" alt="Shopping Cart" class="cart-icon">
                        </a>
                    </div>
                    <a href="{% url 'users:profile' %}" aria-label="User Profile">
                        <img src="{% static 'Images/user_icon-profile.png' %}" alt="User Profile" class="user-profile">
                    </a>
                </div>
            </div>
        </nav>
    </header>
    
    <div class="divider"></div>

    <!-- Login Container -->
    <div class="login-wrapper">
        <div class="login-container">
            <div class="login-header">
                <div class="logo-container">
                    <div class="bee-icon">🐝</div>
                </div>
                <h1>Bee House</h1>
                <p>Welcome back! Please login to your account</p>
            </div>

            <div class="login-body">
                <!-- Messages -->
                {% if messages %}
                    {% for message in messages %}
                        <div class="alert alert-{{ message.tags }}">{{ message }}</div>
                    {% endfor %}
                {% endif %}

                <!-- Login Form -->
                <form method="POST" action="{% url 'users:login' %}" id="loginForm">
                    {% csrf_token %}

                    <div class="form-group">
                        <label for="username">Username</label>
                        <div class="input-wrapper">
                            <span class="input-icon">👤</span>
                            <input 
                                type="text" 
                                id="username" 
                                name="username" 
                                placeholder="Enter your username" 
                                required 
                                autofocus
                            >
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="password">Password</label>
                        <div class="input-wrapper">
                            <span class="input-icon">🔒</span>
                            <input 
                                type="password" 
                                id="password" 
                                name="password" 
                                placeholder="Enter your password" 
                                required
                            >
                        </div>
                    </div>

                    <div class="form-options">
                        <a href="{% url 'users:forgot_password' %}" class="forgotten-password">Forgot Password?</a>
                    </div>

                    <button type="submit" class="btn-login">Sign In</button>
                </form>

                <div class="register-link">
                    Don't have an account? <a href="{% url 'users:register' %}">Sign Up</a>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Hamburger menu toggle
        document.addEventListener('DOMContentLoaded', function() {
            const menuToggle = document.getElementById('menuToggle');
            const dropdownMenu = document.getElementById('dropdownMenu');
            
            if (menuToggle && dropdownMenu) {
                menuToggle.addEventListener('click', function(e) {
                    e.stopPropagation();
                    dropdownMenu.classList.toggle('active');
                    menuToggle.classList.toggle('active');
                });
                
                // Close menu when clicking outside
                document.addEventListener('click', function(e) {
                    if (!menuToggle.contains(e.target) && !dropdownMenu.contains(e.target)) {
                        dropdownMenu.classList.remove('active');
                        menuToggle.classList.remove('active');
                    }
                });
                
                // Close menu when clicking a link
                const dropdownItems = dropdownMenu.querySelectorAll('.dropdown-item');
                dropdownItems.forEach(item => {
                    item.addEventListener('click', function() {
                        dropdownMenu.classList.remove('active');
                        menuToggle.classList.remove('active');
                    });
                });
            }
        });
    </script>
</body>
</html>
